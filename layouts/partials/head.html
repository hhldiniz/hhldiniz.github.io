{{ $user := .Site.Data.github.user }}
{{ $description := .Site.Params.description }}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ .Site.Title }}</title>
<meta name="description" content="{{ $description }}" />
<meta name="author" content="{{ $user.name }}" />
<link rel="canonical" href="{{ .Permalink }}" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ .Site.Title }}" />
<meta property="og:description" content="{{ $description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
{{ with $user.avatar }}<meta property="og:image" content="{{ . }}" />{{ end }}
<meta name="twitter:card" content="summary" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%91%A8%E2%80%8D%F0%9F%92%BB</text></svg>" />
<link rel="preconnect" href="https://avatars.githubusercontent.com" />
<link rel="stylesheet" href="{{ "css/portfolio.css" | relURL }}" />

<script type="application/ld+json">
  {{ dict
      "@context" "https://schema.org"
      "@type" "Person"
      "name" $user.name
      "url" .Permalink
      "image" $user.avatar
      "description" $description
      "sameAs" (slice $user.url .Site.Params.linkedin)
    | jsonify | safeJS }}
</script>

{{/* Applied before first paint so a light-theme visitor never sees a dark flash. */}}
<script>
  (function () {
    try {
      var stored = window.localStorage.getItem("portfolio-theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
        return;
      }
    } catch (error) {}
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
