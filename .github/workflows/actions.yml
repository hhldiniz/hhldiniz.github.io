name: Deploy to Github Pages

on:
  # Every push to the source branch.
  push:
    branches:
      - master
  # Weekly refresh so new public repositories show up without a manual push.
  schedule:
    - cron: "0 5 * * 1"
  # Manual runs from the Actions tab.
  workflow_dispatch:

# Never let two deploys race each other.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      # Refresh data/github.json from the GitHub API. The committed snapshot is
      # used as-is if the API call fails, so a hiccup never breaks the deploy.
      - name: Refresh GitHub project data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_data.py --user hhldiniz

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build
        run: hugo --minify

      # Push the generated content into the `main` branch, which GitHub Pages serves.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
