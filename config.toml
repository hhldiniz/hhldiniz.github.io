baseURL = 'https://hhldiniz.github.io/'
languageCode = 'en-us'
title = 'Hugo Diniz — Portfolio'
enableRobotsTXT = true
# No blog section: only the single-page showcase is generated.
disableKinds = ['taxonomy', 'term']

[params]
  description = 'Showcase of every public, non-forked project by Hugo Diniz — mobile, backend, and everything in between.'
  tagline = 'Software developer — mobile & backend'
  # The GitHub account the showcase is generated from. Changing it here only
  # affects labels; the data itself comes from scripts/fetch_github_data.py.
  githubUser = 'hhldiniz'
  linkedin = 'https://www.linkedin.com/in/hhldiniz/'
  # Number of most-starred projects promoted to the "Featured" row.
  featuredCount = 4

[markup.goldmark.renderer]
  unsafe = true
